# Fail2Ban jail for the VKAI Panel.
#
# Install this file as /etc/fail2ban/jail.d/vkai-panel.conf and the matching
# filter as /etc/fail2ban/filter.d/vkai-panel-auth.conf. See the README in this
# directory - deploy/fail2ban/README.md - for the full procedure.

[vkai-panel-auth]

enabled = true
filter  = vkai-panel-auth

# The panel's authentication log. Change this if VKAI_PANEL_ROOT, VKAI_LOG_ROOT
# or VKAI_AUTH_LOG moves it.
logpath = /vkai-panel/logs/auth.log

backend = auto

# The panel's own listening port, plus the ports a reverse proxy in front of it
# uses. Adjust to match the port in the panel's configuration.
port = 30110,http,https

# Why these numbers.
#
# The panel's own limiter already allows eight failures against one
# address-account pair before it locks that pair, and applies a growing delay
# well before that. Banning earlier than the panel's own lock would be banning
# people the panel was still willing to serve - typically a legitimate user
# working through a password manager.
#
# Twelve refused attempts in ten minutes is past that point: it is either an
# attacker who has been locked out and is still knocking, or one spraying
# several accounts from the same address. Neither has a reason to keep going.
maxretry = 12
findtime = 10m

# One hour to start with, doubling for a repeat offender, capped at two days.
# An escalating ban costs a persistent attacker far more than a fixed one while
# still releasing a NAT gateway that produced a single bad afternoon.
bantime           = 1h
bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 48h

# Never ban the machine itself or the reverse proxy in front of the panel. Add
# the operator's own address here: a defence that can lock the administrator
# out of the panel is a defence that gets switched off after the first
# incident.
ignoreself = true
ignoreip   = 127.0.0.1/8 ::1

# The action is inherited from jail.conf. On a host using nftables set
#   banaction = nftables-multiport
# in this section, or globally in jail.local.
