# Fail2Ban filter for the VKAI Panel authentication log.
#
# It reads the lines written by core/internal/middleware/authlog.go, one per
# authentication attempt:
#
#   2026-08-28T09:14:02Z vkai-auth outcome=failure reason=invalid_credentials \
#     ip=203.0.113.9 account=admin scope=login path=/api/v1/auth/login request_id=8f2c...
#
# The field order up to and including "ip=" is a contract between this file and
# the panel. It is asserted from both sides by
# core/internal/middleware/authlog_fail2ban_test.go, which reads THIS FILE and
# matches it against lines the panel actually produces. Editing the failregex
# here without editing the format there - or the other way round - fails the
# build rather than quietly producing a jail that never bans anybody.
#
# The panel does not need fail2ban. Its own limiter already slows and locks an
# attacker. This jail moves the block down to the firewall, where a banned
# attacker pays for a refused TCP connection instead of for a request the panel
# has to parse, authenticate against Redis and answer.

[Definition]

_daemon = vkai-panel

# Two outcomes are worth banning:
#
#   failure - a credential was presented and rejected.
#   blocked - the panel's own limiter refused the attempt. Somebody who keeps
#             knocking after being locked out is not a confused user, and each
#             of those requests still costs the panel a Redis round trip.
#
# The optional leading "\S+\s+" absorbs the timestamp for the case where
# fail2ban has not already stripped it with the datepattern below.
#
# IPv6 requires fail2ban 0.10 or newer, where <HOST> covers IPv6 addresses.
# On fail2ban 0.9 the IPv4 lines still match and the IPv6 ones are ignored.
failregex = ^\s*(?:\S+\s+)?vkai-auth outcome=(?:failure|blocked) reason=\S+ ip=<HOST> account=

# Successful authentications are never a reason to ban.
ignoreregex = ^\s*(?:\S+\s+)?vkai-auth outcome=success

# The panel writes RFC3339 in UTC. The first pattern consumes the trailing "Z";
# the second is the fallback for a build that ever writes local time without an
# offset.
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S%%z
              ^%%Y-%%m-%%dT%%H:%%M:%%S
