# =============================================================================
# VKAI Panel - reverse proxy FOR THE PANEL ONLY
# HiTechCloud (hitechcloud.vn)
# -----------------------------------------------------------------------------
# PORTS 80 AND 443 DO NOT APPEAR IN THIS FILE, and must never appear here. Both
# belong to the customer websites, whose vhosts live in separate files with
# document roots under /vkai-panel/www/domains/<domain>. The panel always
# listens on a port of its own - 8888 by default - behind a security entrance
# such as /vkai_a1b2c3d4. Keeping them apart means a mistake in a customer
# vhost cannot expose the panel.
#
# ONE FRONT DOOR
# -----------------------------------------------------------------------------
# Everything on the panel port goes to ONE upstream: the Go API (vkai-api).
# That process checks the security entrance and then serves the interface by
# forwarding to the Next.js service itself (core/internal/uiproxy). nginx does
# not talk to Next.js at all.
#
# This file used to send "/" straight to Next.js and only "/api/" to the API,
# with the entrance check offered here as a commented-out block for the operator
# to enable. The result on every installation was that the entrance guarded the
# API and nothing else: the whole interface, the login form included, was served
# to anyone who found the port, and the URL the installer prints returned 404
# because Next.js knows nothing about the entrance. A security control that is
# off by default is not a security control, so the choice was removed: the guard
# is in the request path by construction.
#
# The alternative - having nginx enforce the entrance for the interface and
# proxying the entrance location to the API so the cookie is still issued - was
# rejected on purpose. It puts the same rule in two places that must be kept in
# step; it makes rotating the entrance a configuration rewrite plus a reload
# instead of one restart; nginx cannot verify the HMAC-signed entrance cookie,
# so it would have to trust any request that merely carries one; and a request
# nginx rejects looks different from a request the panel rejects, which is
# exactly the fingerprint the neutral 404 exists to deny. Do not reintroduce it.
#
# THIS FILE IS A TEMPLATE. deploy/install.sh renders it into
# /etc/nginx/conf.d/vkai-panel.conf, replacing the __VKAI_*__ tokens with the
# values of the actual installation. Render it by hand with:
#
#   sed -e 's/__VKAI_PANEL_PORT__/8888/g'   -e 's/__VKAI_LISTEN_OPTS__//g' \
#       -e 's/__VKAI_API_PORT__/30110/g'    -e 's/__VKAI_SERVER_NAME__/_/g' \
#       -e 's#__VKAI_LOG_DIR__#/vkai-panel/logs#g' \
#       -e '/__VKAI_TLS_BLOCK__/d'          -e '/__VKAI_ALLOW_BLOCK__/d' \
#       deploy/nginx/vkai-panel.conf >/etc/nginx/conf.d/vkai-panel.conf
#   nginx -t && systemctl reload nginx
#
# The API (vkai-api) and the UI (vkai-ui) are systemd services on THIS machine
# listening on loopback only, so the upstream is always 127.0.0.1 and never a
# container service name. Which loopback port the API forwards the interface to
# is the API's own setting (VKAI_UI_UPSTREAM in /vkai-panel/etc/.env), not
# nginx's.
# =============================================================================

# Forward the Connection header correctly: "upgrade" for WebSockets, empty for
# ordinary HTTP so that keepalive to the upstream keeps working. The variable is
# prefixed vkai_ so it cannot collide with another map on the same server.
map $http_upgrade $vkai_connection_upgrade {
    default upgrade;
    ''      '';
}

# --- Upstream ----------------------------------------------------------------
# The panel process. It runs natively on this machine (systemd) and binds
# loopback only. There is deliberately no second upstream here: the interface is
# reached THROUGH this one, after the access gate has passed.
upstream vkai_api {
    server 127.0.0.1:__VKAI_API_PORT__;
    keepalive 16;
}

server {
    # THE PANEL PORT. Never 80, never 443.
    listen __VKAI_PANEL_PORT____VKAI_LISTEN_OPTS__;
    listen [::]:__VKAI_PANEL_PORT____VKAI_LISTEN_OPTS__;

    # "_" accepts any Host. With --domain the installer pins the real name here,
    # so every other Host gets nothing - the panel does not advertise itself to
    # scanners.
    server_name __VKAI_SERVER_NAME__;

    # --- Panel TLS -----------------------------------------------------------
    # Rendered by the installer from --tls-mode. The panel certificate is
    # completely independent of the customer site certificates.
__VKAI_TLS_BLOCK__

    # --- Source address restriction ------------------------------------------
    # First barrier, right here in nginx. The panel enforces the same list a
    # second time through VKAI_PANEL_ALLOWED_IPS in /vkai-panel/etc/.env.
__VKAI_ALLOW_BLOCK__

    server_tokens off;

    # --- Security headers ----------------------------------------------------
    # "always" so they are set on error responses too. Do not add an add_header
    # inside a location below: an add_header in a nested block replaces this
    # whole set instead of extending it.
    add_header X-Frame-Options           "DENY"                            always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "0"                               always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                    always;

    client_max_body_size 512m;
    client_body_timeout  120s;

    access_log __VKAI_LOG_DIR__/vkai-panel.access.log;
    error_log  __VKAI_LOG_DIR__/vkai-panel.error.log warn;

    # --- API -----------------------------------------------------------------
    # Its own location only for the longer timeouts and the unbuffered
    # responses; the upstream is the same one everything else uses.
    # The WebSocket routes live under /api/v1/ws, so they arrive here rather than
    # in some separate /ws/ location. This block therefore has to be able to carry
    # an upgrade: setting Connection to the empty string unconditionally - which is
    # right for keepalive to the upstream and wrong for a WebSocket - is what
    # disconnected every terminal session before it started.
    #
    # $vkai_connection_upgrade is "upgrade" when the client asked for one and empty
    # otherwise, so ordinary requests keep their keepalive behaviour.
    location /api/ {
        proxy_pass http://vkai_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $vkai_connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # --- WebSocket (terminal, live logs) -------------------------------------
    # There is deliberately no /ws/ location. The WebSocket routes are registered
    # under /api/v1/ws and are carried by the /api/ block above. A block here with
    # correct upgrade headers, in front of a prefix nothing serves, is how the
    # right configuration ended up on the one path no request ever takes.


    # --- Health check: not behind the entrance -------------------------------
    # The panel answers /health and /api/v1/health without the entrance so a
    # load balancer never needs to know the secret. /health is the canonical
    # one.
    location = /health {
        proxy_pass http://vkai_api/health;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --- Everything else: the panel itself ------------------------------------
    # Pages, the login form, /_next/... and every static asset. They all reach
    # the access gate first and only then the interface, which is the whole
    # point of this file.
    #
    # There is deliberately no separate location for /_next/static: Next.js
    # already marks those responses immutable for a year, and a location of
    # their own would drop the security headers set above.
    location / {
        proxy_pass http://vkai_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $vkai_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }
}
