# =============================================================================
# VKAI Panel - reverse proxy CHI DANH CHO PANEL
# HiTechCloud (hitechcloud.vn)
# -----------------------------------------------------------------------------
# CONG 80 VA 443 KHONG XUAT HIEN TRONG FILE NAY, va khong duoc phep xuat hien.
# Hai cong do danh RIENG cho website cua khach (vhost nam o file khac, thu muc
# ma nguon /vkai-panel/www/domains/<domain>). Panel luon nghe tren mot cong
# rieng - mac dinh 8888 - kem mot loi vao an toan dang /vkai_a1b2c3d4.
# Tach bach nhu vay thi mot cau hinh sai o vhost cua khach khong the lam lo panel.
#
# CAI TREN MAY CHU (systemd, khong Docker):
#   deploy/install.sh tu dong copy file nay sang /etc/nginx/conf.d/vkai-panel.conf
#   va doi hai dong "server" trong khoi upstream sang 127.0.0.1.
#   Lam bang tay:
#     cp deploy/nginx/vkai-panel.conf /etc/nginx/conf.d/vkai-panel.conf
#     sed -i 's/server vkai-ui:3000;/server 127.0.0.1:3000;/'      /etc/nginx/conf.d/vkai-panel.conf
#     sed -i 's/server vkai-core:30110;/server 127.0.0.1:30110;/'  /etc/nginx/conf.d/vkai-panel.conf
#     sed -i 's/8888/<CONG_PANEL>/g'                               /etc/nginx/conf.d/vkai-panel.conf
#     nginx -t && systemctl reload nginx
#
# TRONG DOCKER:
#   docker-compose.yml mount file nay vao container nginx nguyen ven. Ten
#   upstream la ten dich vu compose (vkai-core, vkai-ui) nen KHONG duoc doi.
# =============================================================================

# Chuyen tiep header Connection dung cach: "upgrade" voi WebSocket, rong voi
# HTTP thuong (de keepalive toi upstream con hieu luc). Ten bien co tien to
# vkai_ de khong dung do voi map cua cau hinh khac tren cung may.
map $http_upgrade $vkai_connection_upgrade {
    default upgrade;
    ''      '';
}

# --- Upstream ----------------------------------------------------------------
# Docker: ten dich vu compose. May chu: 127.0.0.1 (xem ghi chu tren).
upstream vkai_ui {
    server vkai-ui:3000;
    # server 127.0.0.1:3000;      # <- ban systemd
    keepalive 16;
}

upstream vkai_api {
    server vkai-core:30110;
    # server 127.0.0.1:30110;     # <- ban systemd
    keepalive 16;
}

server {
    # CONG PANEL. Khong bao gio la 80 hay 443.
    listen 8888;
    listen [::]:8888;

    # Rang buoc ten mien panel (tuy chon): thay "_" bang ten mien that de moi
    # Host khac nhan 444 - panel khong lo su ton tai voi may quet.
    server_name _;

    # --- TLS rieng cho panel (tuy chon) --------------------------------------
    # Doi "listen 8888;" thanh "listen 8888 ssl;" roi bo comment 4 dong duoi.
    # Chung chi nay doc lap hoan toan voi chung chi cua website khach.
    # ssl_certificate     /vkai-panel/ssl/panel.crt;
    # ssl_certificate_key /vkai-panel/ssl/panel.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers off;

    # --- Gioi han IP (tuy chon) ----------------------------------------------
    # Lop chan thu nhat, ngay tai nginx. Panel con mot lop nua qua
    # VKAI_PANEL_ALLOWED_IPS trong /vkai-panel/etc/.env.
    # allow 203.0.113.7;
    # allow 10.0.0.0/8;
    # deny  all;

    server_tokens off;

    # --- Header bao mat ------------------------------------------------------
    add_header X-Frame-Options           "DENY"                            always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "0"                               always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                    always;
    # Bat khi panel da chay HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 512m;
    client_body_timeout  120s;

    access_log /var/log/nginx/vkai-panel.access.log;
    error_log  /var/log/nginx/vkai-panel.error.log warn;

    # --- Loi vao an toan -----------------------------------------------------
    # API tu kiem tra loi vao (VKAI_PANEL_ENTRANCE), nen khong bat buoc cau
    # hinh gi o day. Neu muon nginx chan luon truoc khi cham toi panel, bo
    # comment khoi duoi, thay /vkai_a1b2c3d4 bang loi vao that
    # (xem: vkai info) va them "return 404;" vao location / .
    #
    # location ^~ /vkai_a1b2c3d4/ {
    #     proxy_pass http://vkai_ui/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # --- API -----------------------------------------------------------------
    # Van bi backend kiem tra loi vao an toan.
    location /api/ {
        proxy_pass http://vkai_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # --- WebSocket (terminal, nhat ky realtime) ------------------------------
    location /ws/ {
        proxy_pass http://vkai_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # --- Kiem tra suc khoe: khong qua loi vao an toan ------------------------
    location = /health {
        proxy_pass http://vkai_api/health;
        access_log off;
    }

    # --- Tai nguyen tinh cua Next.js -----------------------------------------
    # Ten file da co bam noi dung nen cache duoc lau.
    location /_next/static/ {
        proxy_pass http://vkai_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --- Giao dien Next.js ---------------------------------------------------
    location / {
        proxy_pass http://vkai_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $vkai_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }
}
