# VKAI Panel - Development Docker Compose
# Only for development/testing - Production uses systemd services
#
# This file starts the dependencies only; the API (core/) and the UI (panel/)
# run on the host. The panel still refuses to use 80/443: run the API with its
# own port, exactly like production.
#
#   export VKAI_PANEL_PORT=8888
#   export VKAI_PANEL_ENTRANCE=/vkai_dev
#   export VKAI_PANEL_CONFIG_FILE=$PWD/.panel_access.json   # no root needed
#   cd core && go run ./cmd/api        # -> http://127.0.0.1:8888/vkai_dev/
#   cd panel && npm run dev
#
# Leave VKAI_PANEL_ENTRANCE unset to have one generated and printed in the
# startup banner. See docs/PANEL_ACCESS.md.

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: vkai-postgres
    environment:
      POSTGRES_DB: vkai_panel
      POSTGRES_USER: vkai
      POSTGRES_PASSWORD: vkai_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./core/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vkai -d vkai_panel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vkai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
