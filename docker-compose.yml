version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: vkai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vkai
      POSTGRES_PASSWORD: vkai_password
      POSTGRES_DB: vkai_panel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vkai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vkai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # vKAI Panel API
  api:
    build:
      context: .
      target: api
    container_name: vkai-api
    restart: unless-stopped
    ports:
      - "30110:30110"
    environment:
      VKAI_DB_HOST: postgres
      VKAI_DB_PORT: 5432
      VKAI_DB_USER: vkai
      VKAI_DB_PASSWORD: vkai_password
      VKAI_DB_NAME: vkai_panel
      VKAI_REDIS_HOST: redis
      VKAI_REDIS_PORT: 6379
      VKAI_JWT_SECRET: change-this-to-a-random-secret-key-in-production
      VKAI_SERVER_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # vKAI Panel Frontend
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vkai-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:30110
    depends_on:
      - api

  # vKAI Agent (for local testing)
  agent:
    build:
      context: .
      target: agent
    container_name: vkai-agent
    restart: unless-stopped
    ports:
      - "30111:30111"
    environment:
      VKAI_PANEL_URL: http://api:30110
      VKAI_AGENT_TOKEN: your-agent-token-here
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
