version: '3.8'

# VKAI Panel - production compose (HiTechCloud)
#
# THU MUC MA NGUON: core/ (Go API), panel/ (Next.js UI), agent/ (Go node agent).
#
# PORT POLICY (aaPanel model, see docs/PANEL_ACCESS.md):
#   - 80 / 443 belong to the CUSTOMER WEBSITES this server hosts. They are
#     deliberately NOT published by any service in this file. Serve the customer
#     vhosts from the host webserver, or from a separate compose stack.
#   - The panel is reached ONLY on its own port (VKAI_PANEL_PORT, default 8888),
#     behind the security entrance enforced by the API.
#
# Publishing the panel on 80/443 would put the admin API on the two ports every
# scanner on the internet tries first; that is exactly what this layout avoids.
#
# DUONG DAN CHUAN TREN MAY CHU (bind mount, xem VKAI_PANEL_ROOT / VKAI_WEB_ROOT):
#   /vkai-panel/etc                  cau hinh panel
#   /vkai-panel/ssl                  chung chi
#   /vkai-panel/logs                 nhat ky panel
#   /vkai-panel/www/domains/<domain> ma nguon website cua khach

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: vkai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${VKAI_DB_USER:-vkai}
      POSTGRES_PASSWORD: ${VKAI_DB_PASSWORD:?VKAI_DB_PASSWORD is required}
      POSTGRES_DB: ${VKAI_DB_NAME:-vkai_panel}
    # Bound to loopback: the database is for the panel, not for the internet.
    ports:
      - "127.0.0.1:${VKAI_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./core/migrations:/docker-entrypoint-initdb.d
    networks:
      - vkai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VKAI_DB_USER:-vkai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vkai-redis
    restart: unless-stopped
    command: redis-server --requirepass ${VKAI_REDIS_PASSWORD:?VKAI_REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:${VKAI_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - vkai-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${VKAI_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Core API (Go) - thu muc core/
  vkai-core:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: vkai-core
    restart: unless-stopped
    environment:
      # Panel access gate. Inside the network the API listens on 30110; the
      # panel port itself is published by the nginx service below, so the two
      # cannot fight over the same host port.
      VKAI_PANEL_ENABLED: "true"
      VKAI_PANEL_BIND: 0.0.0.0
      VKAI_PANEL_PORT: 30110
      # Empty on the first start: an entrance is generated, persisted under
      # /vkai-panel/etc and printed by "docker compose logs vkai-core".
      VKAI_PANEL_ENTRANCE: ${VKAI_PANEL_ENTRANCE:-}
      VKAI_PANEL_ENTRANCE_ENABLED: ${VKAI_PANEL_ENTRANCE_ENABLED:-true}
      VKAI_PANEL_ALLOWED_IPS: ${VKAI_PANEL_ALLOWED_IPS:-}
      # nginx below is the only hop in front of the API, so X-Forwarded-For is
      # trusted from the compose network and from nowhere else.
      VKAI_PANEL_TRUSTED_PROXIES: ${VKAI_PANEL_TRUSTED_PROXIES:-172.16.0.0/12}
      VKAI_PANEL_DOMAIN: ${VKAI_PANEL_DOMAIN:-}
      VKAI_PANEL_CONFIG_FILE: /etc/vkai/panel_access.json

      # Duong dan chuan ben trong container.
      VKAI_PANEL_ROOT: /vkai-panel
      VKAI_WEB_ROOT: /vkai-panel/www/domains
      VKAI_FILEMANAGER_ROOT: /vkai-panel/www/domains
      VKAI_BACKUP_ROOT: /vkai-panel/www/backup

      VKAI_SERVER_HOST: 0.0.0.0
      VKAI_SERVER_PORT: 30110
      VKAI_DB_HOST: postgres
      VKAI_DB_PORT: 5432
      VKAI_DB_USER: ${VKAI_DB_USER:-vkai}
      VKAI_DB_PASSWORD: ${VKAI_DB_PASSWORD:?VKAI_DB_PASSWORD is required}
      VKAI_DB_NAME: ${VKAI_DB_NAME:-vkai_panel}
      VKAI_DB_SSLMODE: ${VKAI_DB_SSLMODE:-disable}
      VKAI_REDIS_HOST: redis
      VKAI_REDIS_PORT: 6379
      VKAI_REDIS_PASSWORD: ${VKAI_REDIS_PASSWORD:?VKAI_REDIS_PASSWORD is required}
      VKAI_JWT_SECRET: ${VKAI_JWT_SECRET:?VKAI_JWT_SECRET is required}
      VKAI_SECRET_KEY: ${VKAI_SECRET_KEY:-}
      VKAI_CORS_ALLOWED_ORIGINS: ${VKAI_CORS_ALLOWED_ORIGINS:-}
      VKAI_LOG_LEVEL: ${VKAI_LOG_LEVEL:-info}
    # Loopback only. The panel is entered through the panel port on nginx; this
    # mapping exists for local debugging and never leaves the host.
    ports:
      - "127.0.0.1:${VKAI_API_PORT:-30110}:30110"
    volumes:
      - ${VKAI_PANEL_ROOT:-/vkai-panel}/etc:/etc/vkai
      - ${VKAI_WEB_ROOT:-/vkai-panel/www/domains}:/vkai-panel/www/domains
      - ${VKAI_PANEL_ROOT:-/vkai-panel}/www/backup:/vkai-panel/www/backup
      - ${VKAI_PANEL_ROOT:-/vkai-panel}/logs:/vkai-panel/logs
      - ${VKAI_PANEL_ROOT:-/vkai-panel}/ssl:/vkai-panel/ssl
    networks:
      vkai-network:
        aliases:
          # Ten dich vu cu, giu lai de upstream nginx / cau hinh da trien khai
          # truoc day van phan giai duoc trong khi chuyen doi.
          - backend
          - api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /health bypasses the access gate on purpose, so the probe never needs
      # to know the entrance.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:30110/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Panel UI (Next.js) - thu muc panel/
  vkai-ui:
    build:
      context: ./panel
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* duoc NHUNG THANG VAO BUNDLE LUC BUILD, khong phai luc
        # chay. Vi vay phai truyen qua build.args; dat o "environment" thi bundle
        # da build xong se mang chuoi rong.
        #
        # Gia tri phai la URL ma TRINH DUYET truy cap duoc. De TRONG (mac dinh)
        # nghia la same-origin qua reverse proxy nginx ben duoi - dung nhat cho
        # trien khai chuan. TUYET DOI khong dat hostname noi bo kieu
        # http://vkai-core:30110: trinh duyet cua nguoi dung khong phan giai duoc.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: vkai-ui
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # KHONG dat NEXT_PUBLIC_API_URL o day: bien nay chi co tac dung luc build
      # (xem build.args ben tren).
    # Not published: the UI is only reachable through the panel port.
    expose:
      - "3000"
    networks:
      vkai-network:
        aliases:
          - frontend
    depends_on:
      vkai-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Node agent - thu muc agent/
  vkai-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: vkai-agent
    restart: unless-stopped
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 30111
      API_SERVER_URL: http://vkai-core:30110
      VKAI_AGENT_TOKEN: ${VKAI_AGENT_TOKEN:?VKAI_AGENT_TOKEN is required}
      LOG_LEVEL: ${VKAI_LOG_LEVEL:-info}
      LOG_FORMAT: ${VKAI_LOG_FORMAT:-json}
    ports:
      - "127.0.0.1:${VKAI_AGENT_PORT:-30111}:30111"
    networks:
      vkai-network:
        aliases:
          - agent
    depends_on:
      vkai-core:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      - ${VKAI_WEB_ROOT:-/vkai-panel/www/domains}:/vkai-panel/www/domains
      - ${VKAI_PANEL_ROOT:-/vkai-panel}/logs:/vkai-panel/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:30111/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Panel entrance - reverse proxy for the PANEL ONLY.
  #
  # It publishes exactly one port: the panel port. It must never be given 80 or
  # 443 here; those are reserved for the customer vhosts, which are served by a
  # separate webserver (host nginx, or a second compose stack with its own
  # container). Keeping the two apart is what stops a mistake in a customer
  # vhost from exposing the panel.
  nginx:
    image: nginx:alpine
    container_name: vkai-nginx-panel
    restart: unless-stopped
    ports:
      - "${VKAI_PANEL_PORT:-8888}:8888"
    volumes:
      - ./deploy/nginx/vkai-panel.conf:/etc/nginx/conf.d/default.conf:ro
      - ${VKAI_PANEL_ROOT:-/vkai-panel}/ssl:/etc/nginx/ssl:ro
      - ${VKAI_PANEL_ROOT:-/vkai-panel}/logs:/var/log/nginx
    networks:
      - vkai-network
    depends_on:
      - vkai-ui
      - vkai-core

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  vkai-network:
    driver: bridge
