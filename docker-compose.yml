version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: vkai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-vkai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vkai_password}
      POSTGRES_DB: ${DB_NAME:-vkai_panel}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - vkai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vkai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vkai-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - vkai-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vkai-backend
    restart: unless-stopped
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 30110
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-vkai}
      DB_PASSWORD: ${DB_PASSWORD:-vkai_password}
      DB_NAME: ${DB_NAME:-vkai_panel}
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "${API_PORT:-30110}:30110"
    networks:
      - vkai-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:30110/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vkai-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:30110
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - vkai-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Agent
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: vkai-agent
    restart: unless-stopped
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 30111
      API_SERVER_URL: http://backend:30110
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "${AGENT_PORT:-30111}:30111"
    networks:
      - vkai-network
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:30111/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: vkai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/vkai-panel.conf:/etc/nginx/conf.d/default.conf
      - ./deploy/nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    networks:
      - vkai-network
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  vkai-network:
    driver: bridge
      VKAI_DB_USER: vkai
      VKAI_DB_PASSWORD: vkai_password
      VKAI_DB_NAME: vkai_panel
      VKAI_REDIS_HOST: redis
      VKAI_REDIS_PORT: 6379
      VKAI_JWT_SECRET: change-this-to-a-random-secret-key-in-production
      VKAI_SERVER_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # vKAI Panel Frontend
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vkai-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:30110
    depends_on:
      - api

  # vKAI Agent (for local testing)
  agent:
    build:
      context: .
      target: agent
    container_name: vkai-agent
    restart: unless-stopped
    ports:
      - "30111:30111"
    environment:
      VKAI_PANEL_URL: http://api:30110
      VKAI_AGENT_TOKEN: your-agent-token-here
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
