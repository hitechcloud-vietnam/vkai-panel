name: Decrypt source
description: >
  Decrypt source that vkai-crypt encrypted in the repository.
  If encryption is not switched on yet this step does nothing and still
  succeeds, so it works both before and after encryption is enabled.

runs:
  using: composite
  steps:
    - name: Detect whether the source is encrypted
      id: detect
      shell: bash
      run: |
        set -euo pipefail
        if grep -rlq --binary-files=text '^VKAICRYPT1' \
             --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next . 2>/dev/null; then
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "Encrypted source detected."
        else
          echo "needed=false" >> "$GITHUB_OUTPUT"
          echo "Encryption is not enabled here; skipping decryption."
        fi

    # The decryptor is Go with only the standard library. Go is installed only
    # when it is actually needed, so a job that has nothing to do with Go (the
    # panel build, for one) is not slowed down for nothing.
    - name: Set up Go for the decryptor
      if: steps.detect.outputs.needed == 'true'
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: false

    - name: Decrypt
      if: steps.detect.outputs.needed == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${VKAI_CRYPT_KEY:-}" ]; then
          echo "::error::The source is encrypted but the VKAI_CRYPT_KEY secret is missing."
          echo "Add it under Settings > Secrets and variables > Actions."
          echo "Note: secrets are not given to workflows run from a fork. That is deliberate."
          exit 1
        fi
        # tools/protect is deliberately left unencrypted so it can always run
        # here. It is also its OWN Go module: there is no go.mod at the
        # repository root, so `go run ./tools/protect/...` from the root fails
        # with "cannot find main module" and every job dies before it builds.
        # The command has to be issued from inside that module, with the tree to
        # decrypt named as an absolute path.
        cd tools/protect
        go run ./cmd/vkai-crypt decrypt-tree "$GITHUB_WORKSPACE"
        echo "Source decrypted."
