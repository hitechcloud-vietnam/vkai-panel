name: Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  # Never cancel a deploy midway: two concurrent runs would fight over the
  # /vkai-panel/current symlink on the target host.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: panel/package-lock.json

      # `go build -o` does not create parent directories, so dist/ must exist first.
      - name: Prepare dist
        run: mkdir -p dist/panel

      - name: Build Core API
        working-directory: core
        run: |
          set -euo pipefail
          # Only ./cmd/api and ./cmd/cli exist; ./cmd/agent never did.
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../dist/api ./cmd/api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../dist/vkai-cli ./cmd/cli

      - name: Build Agent
        working-directory: agent
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../dist/vkaid ./cmd

      - name: Stage migrations
        run: cp -r core/migrations dist/migrations

      - name: Build Panel UI
        working-directory: panel
        env:
          # Inlined into the bundle at BUILD time. Must be a URL the BROWSER can
          # reach; empty = same-origin through the panel reverse proxy. Never an
          # internal hostname such as http://vkai-core:30110.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || '' }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          cp -r .next ../dist/panel/.next
          cp package.json package-lock.json ../dist/panel/
          if [ -d public ]; then cp -r public ../dist/panel/; fi

      - name: Create deployment package
        run: tar -czf vkai-panel-${{ github.sha }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          if-no-files-found: error
          path: vkai-panel-${{ github.sha }}.tar.gz

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    # `inputs.environment` (not github.event.inputs.*) so the value is null,
    # rather than an empty string, on push events.
    # Bo qua khi chua cau hinh secret may chu: khong co secret thi khong the trien khai,
    # va mot workflow do vi thieu ha tang se lam nhieu tin hieu CI tren main.
    if: >-
      (github.ref == 'refs/heads/main' || inputs.environment == 'staging')
      && secrets.STAGING_HOST != '' && secrets.STAGING_SSH_KEY != ''
    environment: staging

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      # The previous version extracted /tmp/<pkg>.tar.gz on the server but never
      # copied it there, so every deploy failed on a missing file.
      - name: Copy package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: vkai-panel-${{ github.sha }}.tar.gz
          target: /tmp

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /vkai-panel/releases/${{ github.sha }}
            tar -xzf /tmp/vkai-panel-${{ github.sha }}.tar.gz \
              -C /vkai-panel/releases/${{ github.sha }}
            ln -sfn /vkai-panel/releases/${{ github.sha }} /vkai-panel/current
            sudo systemctl restart vkai-api vkai-ui
            sleep 5
            curl -fsS http://localhost:30110/health
            echo "Staging deployment successful!"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, deploy-staging]
    # A job whose `needs` target is skipped is skipped too, unless the condition
    # tolerates it. On a v* tag deploy-staging is skipped, which previously made
    # production unreachable in every scenario.
    if: |
      !cancelled()
      && needs.build.result == 'success'
      && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
      && (startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'production')
      && secrets.PRODUCTION_HOST != '' && secrets.PRODUCTION_SSH_KEY != ''
    environment: production

    # The `secrets` context is not available in a step-level `if:`, so the
    # connection string is mapped to env and the step tests the env value.
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Copy package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: vkai-panel-${{ github.sha }}.tar.gz
          target: /tmp

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /vkai-panel/releases/${{ github.sha }}
            tar -xzf /tmp/vkai-panel-${{ github.sha }}.tar.gz \
              -C /vkai-panel/releases/${{ github.sha }}
            ln -sfn /vkai-panel/releases/${{ github.sha }} /vkai-panel/current
            sudo systemctl restart vkai-api vkai-ui
            sleep 10
            curl -fsS http://localhost:30110/health
            echo "Production deployment successful!"

      # `./api migrate up` was removed: cmd/api is a plain HTTP server with no
      # subcommand parsing, so it would bind a port and hang until the SSH step
      # timed out. Migrations now run as plain SQL, and only when a connection
      # string is configured.
      - name: Run database migrations
        if: ${{ env.DATABASE_URL != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: DATABASE_URL
          script: |
            set -euo pipefail
            for f in /vkai-panel/current/migrations/*.sql; do
              echo "Applying $(basename "$f")"
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
            done

      # NOTE: creating the GitHub Release is release.yml's job exclusively.
      # Doing it here as well made two workflows race for the same tag.
