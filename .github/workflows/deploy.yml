name: Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Backend
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../dist/api ./cmd/api/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../dist/agent ./cmd/agent/main.go

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          cp -r .next ../dist/frontend
          cp package.json ../dist/frontend/
          cp -r public ../dist/frontend/ 2>/dev/null || true

      - name: Create deployment package
        run: |
          tar -czf vkai-panel-${{ github.sha }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: vkai-panel-${{ github.sha }}.tar.gz

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment: staging
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            # Create deployment directory
            mkdir -p /opt/vkai-panel/releases/${{ github.sha }}
            
            # Upload and extract package
            cd /opt/vkai-panel/releases/${{ github.sha }}
            tar -xzf /tmp/vkai-panel-${{ github.sha }}.tar.gz
            
            # Update symlink
            ln -sfn /opt/vkai-panel/releases/${{ github.sha }} /opt/vkai-panel/current
            
            # Restart services
            sudo systemctl restart vkai-panel-api
            sudo systemctl restart vkai-panel-frontend
            
            # Health check
            sleep 5
            curl -f http://localhost:30110/health || exit 1
            
            echo "Deployment successful!"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment: production
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            # Create deployment directory
            mkdir -p /opt/vkai-panel/releases/${{ github.sha }}
            
            # Upload and extract package
            cd /opt/vkai-panel/releases/${{ github.sha }}
            tar -xzf /tmp/vkai-panel-${{ github.sha }}.tar.gz
            
            # Update symlink
            ln -sfn /opt/vkai-panel/releases/${{ github.sha }} /opt/vkai-panel/current
            
            # Run database migrations
            cd /opt/vkai-panel/current
            ./api migrate up
            
            # Restart services
            sudo systemctl restart vkai-panel-api
            sudo systemctl restart vkai-panel-frontend
            
            # Health check
            sleep 10
            curl -f http://localhost:30110/health || exit 1
            
            echo "Production deployment successful!"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: vkai-panel-${{ github.sha }}.tar.gz
          generate_release_notes: true
