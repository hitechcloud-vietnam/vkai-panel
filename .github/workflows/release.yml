name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.0.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}
            
            ## Installation
            
            ### Using Install Script
            ```bash
            curl -fsSL https://raw.githubusercontent.com/hitechcloud-vietnam/vkai-panel/main/deploy/install.sh | sudo bash
            ```
            
            ### Manual Installation
            See [Deployment Guide](https://github.com/hitechcloud-vietnam/vkai-panel/blob/main/docs/DEPLOYMENT.md) for manual installation instructions.
            
            ## Docker
            
            ```bash
            docker pull hitechcloud/vkai-panel-backend:latest
            docker pull hitechcloud/vkai-panel-frontend:latest
            docker pull hitechcloud/vkai-panel-agent:latest
            ```
            
            ## Documentation
            
            - [API Documentation](https://github.com/hitechcloud-vietnam/vkai-panel/blob/main/docs/API.md)
            - [User Guide](https://github.com/hitechcloud-vietnam/vkai-panel/blob/main/docs/USER_GUIDE.md)
            - [Developer Guide](https://github.com/hitechcloud-vietnam/vkai-panel/blob/main/docs/DEVELOPER_GUIDE.md)
            - [Deployment Guide](https://github.com/hitechcloud-vietnam/vkai-panel/blob/main/docs/DEPLOYMENT.md)
            
            ## Support
            
            - [GitHub Issues](https://github.com/hitechcloud-vietnam/vkai-panel/issues)
            - [GitHub Discussions](https://github.com/hitechcloud-vietnam/vkai-panel/discussions)
            - [Email](mailto:support@hitechcloud.vn)
          draft: false
          prerelease: false

  build:
    name: Build Release Assets
    runs-on: ubuntu-latest
    needs: release
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Backend
        working-directory: backend
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -o vkai-api-${{ matrix.os }}-${{ matrix.arch }} ./cmd/api/
          go build -o vkai-migrate-${{ matrix.os }}-${{ matrix.arch }} ./cmd/migrate/

      - name: Build Agent
        working-directory: agent
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -o vkaid-${{ matrix.os }}-${{ matrix.arch }} ./cmd/agent/

      - name: Upload Backend
        uses: actions/upload-artifact@v4
        with:
          name: vkai-api-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            backend/vkai-api-${{ matrix.os }}-${{ matrix.arch }}
            backend/vkai-migrate-${{ matrix.os }}-${{ matrix.arch }}

      - name: Upload Agent
        uses: actions/upload-artifact@v4
        with:
          name: vkaid-${{ matrix.os }}-${{ matrix.arch }}
          path: agent/vkaid-${{ matrix.os }}-${{ matrix.arch }}

  publish:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        run: |
          mkdir -p release
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              # Backend
              cd artifacts/vkai-api-${os}-${arch}
              tar -czf ../../release/vkai-api-${os}-${arch}.tar.gz *
              cd ../..
              
              # Agent
              cd artifacts/vkaid-${os}-${arch}
              tar -czf ../../release/vkaid-${os}-${arch}.tar.gz *
              cd ../..
            done
          done

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: release/vkai-api-linux-amd64.tar.gz
          asset_name: vkai-api-linux-amd64.tar.gz
          asset_content_type: application/gzip

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: release/vkai-api-linux-arm64.tar.gz
          asset_name: vkai-api-linux-arm64.tar.gz
          asset_content_type: application/gzip

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: release/vkai-api-darwin-amd64.tar.gz
          asset_name: vkai-api-darwin-amd64.tar.gz
          asset_content_type: application/gzip

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: release/vkai-api-darwin-arm64.tar.gz
          asset_name: vkai-api-darwin-arm64.tar.gz
          asset_content_type: application/gzip

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: release/vkai-api-windows-amd64.tar.gz
          asset_name: vkai-api-windows-amd64.tar.gz
          asset_content_type: application/gzip

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: release/vkai-api-windows-arm64.tar.gz
          asset_name: vkai-api-windows-arm64.tar.gz
          asset_content_type: application/gzip

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: release/vkaid-linux-amd64.tar.gz
          asset_name: vkaid-linux-amd64.tar.gz
          asset_content_type: application/gzip

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: release/vkaid-linux-arm64.tar.gz
          asset_name: vkaid-linux-arm64.tar.gz
          asset_content_type: application/gzip

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: release/vkaid-darwin-amd64.tar.gz
          asset_name: vkaid-darwin-amd64.tar.gz
          asset_content_type: application/gzip

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: release/vkaid-darwin-arm64.tar.gz
          asset_name: vkaid-darwin-arm64.tar.gz
          asset_content_type: application/gzip

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: release/vkaid-windows-amd64.tar.gz
          asset_name: vkaid-windows-amd64.tar.gz
          asset_content_type: application/gzip

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: release/vkaid-windows-arm64.tar.gz
          asset_name: vkaid-windows-arm64.tar.gz
          asset_content_type: application/gzip
