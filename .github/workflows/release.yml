name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Release Assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Build Core API
        working-directory: core
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          EXT=""; [ "${{ matrix.os }}" = "windows" ] && EXT=".exe"
          # ./cmd/migrate does not exist and never did; only api and cli do.
          go build -o "vkai-api-${{ matrix.os }}-${{ matrix.arch }}${EXT}" ./cmd/api
          go build -o "vkai-cli-${{ matrix.os }}-${{ matrix.arch }}${EXT}" ./cmd/cli

      - name: Build Agent
        working-directory: agent
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          EXT=""; [ "${{ matrix.os }}" = "windows" ] && EXT=".exe"
          # The agent's main package lives at ./cmd, not ./cmd/agent.
          go build -o "vkaid-${{ matrix.os }}-${{ matrix.arch }}${EXT}" ./cmd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vkai-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            core/vkai-api-${{ matrix.os }}-${{ matrix.arch }}*
            core/vkai-cli-${{ matrix.os }}-${{ matrix.arch }}*
            agent/vkaid-${{ matrix.os }}-${{ matrix.arch }}*

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        run: |
          set -euo pipefail
          mkdir -p release
          for d in artifacts/*/; do
            name=$(basename "$d")
            tar -czf "release/${name}.tar.gz" -C "$d" .
          done
          ls -l release

      # Replaces actions/create-release@v1 + 12x actions/upload-release-asset@v1.
      # Both are archived Node12 actions that GitHub-hosted runners refuse to run,
      # and the upload steps referenced needs.release.outputs.upload_url, which was
      # always empty because the release job declared no outputs.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release/*.tar.gz
          body: |
            ## Installation

            ### Using Install Script
            ```bash
            curl -fsSL https://raw.githubusercontent.com/hitechcloud-vietnam/vkai-panel/main/deploy/install.sh | sudo bash
            ```

            ### Manual Installation
            See the [Deployment Guide](https://github.com/hitechcloud-vietnam/vkai-panel/blob/main/docs/DEPLOYMENT.md).

            ## Docker

            ```bash
            docker pull ghcr.io/hitechcloud-vietnam/vkai-panel-core:latest
            docker pull ghcr.io/hitechcloud-vietnam/vkai-panel-ui:latest
            docker pull ghcr.io/hitechcloud-vietnam/vkai-panel-agent:latest
            ```

            ## Documentation

            - [API Documentation](https://github.com/hitechcloud-vietnam/vkai-panel/blob/main/docs/API.md)
            - [User Guide](https://github.com/hitechcloud-vietnam/vkai-panel/blob/main/docs/USER_GUIDE.md)
            - [Developer Guide](https://github.com/hitechcloud-vietnam/vkai-panel/blob/main/docs/DEVELOPER_GUIDE.md)
            - [Deployment Guide](https://github.com/hitechcloud-vietnam/vkai-panel/blob/main/docs/DEPLOYMENT.md)

            ## Support

            - [GitHub Issues](https://github.com/hitechcloud-vietnam/vkai-panel/issues)
            - [GitHub Discussions](https://github.com/hitechcloud-vietnam/vkai-panel/discussions)
            - [Email](mailto:support@hitechcloud.vn)
