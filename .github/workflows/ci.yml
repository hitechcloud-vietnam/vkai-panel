name: CI

# Single source of truth for continuous integration.
# backend-ci.yml and frontend-ci.yml were removed: they duplicated these jobs
# with drifting configuration (postgres 15 vs 16, codecov v3 vs v4,
# REDIS_URL vs REDIS_HOST), which made a change green in one file and red in
# the other. Every job below runs on every push/PR to main and develop, with
# one exception: "Package" (dong goi ban phat hanh tran) chi chay cho push vao
# main, cho tag v*, va cho Pull Request cham vao deploy/ hoac .github/ - xem
# job "Package Scope".
#
# Thu muc ma nguon: core/ (Go API), panel/ (Next.js UI), agent/ (Go node agent).

on:
  push:
    branches: [main, develop]
    # Tag v* kich hoat CI de ban phat hanh duoc dong goi (job "Package").
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Core API
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vkai
          POSTGRES_PASSWORD: vkai_password
          POSTGRES_DB: vkai_panel_test
        options: >-
          --health-cmd "pg_isready -U vkai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        # health-cmd must be quoted, otherwise `ping` is parsed as a separate
        # positional argument to `docker create` and the healthcheck never runs.
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Giải mã mã nguồn
        uses: ./.github/actions/decrypt-source
        env:
          VKAI_CRYPT_KEY: ${{ secrets.VKAI_CRYPT_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so CI can never drift from the module.
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Download dependencies
        working-directory: core
        run: go mod download

      # Blocking: the API must compile.
      - name: Build
        working-directory: core
        run: go build ./...

      # Non-blocking on purpose. golangci-lint currently reports 113 pre-existing
      # findings (105 errcheck, 2 govet, 4 ineffassign, 2 unused) that require
      # source changes. Findings still show up as annotations; flip this to
      # blocking once core/.golangci.yml runs clean.
      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        continue-on-error: true
        with:
          version: v1.59.1
          working-directory: core
          args: --timeout=5m

      - name: Run tests
        working-directory: core
        env:
          # The API reads config through viper with SetEnvPrefix("VKAI"),
          # so only VKAI_*-prefixed variables are seen. Keys are database.* /
          # redis.* / jwt.* (see internal/config/config.go).
          VKAI_DATABASE_HOST: localhost
          VKAI_DATABASE_PORT: '5432'
          VKAI_DATABASE_USER: vkai
          VKAI_DATABASE_PASSWORD: vkai_password
          VKAI_DATABASE_DBNAME: vkai_panel_test
          VKAI_DATABASE_SSLMODE: disable
          VKAI_REDIS_HOST: localhost
          VKAI_REDIS_PORT: '6379'
          VKAI_JWT_SECRET: test-secret-key
        # -vet=off: `go test` runs a vet subset by default, which would fail the
        # run on the same pre-existing findings the (non-blocking) lint step
        # already reports. Compilation is still gated by the Build step above.
        run: go test -vet=off -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: ${{ hashFiles('core/coverage.out') != '' }}
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/coverage.out
          flags: core
          fail_ci_if_error: false

  panel:
    name: Panel UI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Giải mã mã nguồn
        uses: ./.github/actions/decrypt-source
        env:
          VKAI_CRYPT_KEY: ${{ secrets.VKAI_CRYPT_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: panel/package-lock.json

      - name: Install dependencies
        working-directory: panel
        run: npm ci

      # --no-install guarantees the local next binary is used and the ESLint
      # setup wizard can never be triggered (panel/.eslintrc.json exists).
      - name: Run linter
        working-directory: panel
        run: npx --no-install next lint

      - name: Build
        working-directory: panel
        env:
          # NEXT_PUBLIC_* is inlined at BUILD time. The value must be the URL a
          # BROWSER can reach, never an internal hostname such as
          # http://vkai-core:30110. Empty = same-origin through the panel
          # reverse proxy, which is the correct default.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || '' }}
        run: npm run build

      # Runs after the build so that next-env.d.ts (git-ignored, generated by
      # `next build`) is always present on a clean checkout.
      - name: Run type check
        working-directory: panel
        run: npm run type-check

      - name: Run tests
        working-directory: panel
        run: npm test --if-present

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panel-build
          retention-days: 7
          if-no-files-found: error
          # next.config.js sets output:'standalone'; uploading all of .next would
          # also drag in .next/cache (hundreds of MB) for no benefit.
          path: |
            panel/.next/standalone
            panel/.next/static
            panel/public

  agent:
    name: Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Giải mã mã nguồn
        uses: ./.github/actions/decrypt-source
        env:
          VKAI_CRYPT_KEY: ${{ secrets.VKAI_CRYPT_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: true
          # The agent has no third-party dependencies, so there is no go.sum.
          cache-dependency-path: agent/go.mod

      # `go build ./...` cannot be used here: the only package is main at ./cmd,
      # so the implicit output name "cmd" collides with the cmd/ directory.
      - name: Build
        working-directory: agent
        run: go build -o bin/vkaid ./cmd

      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        continue-on-error: true
        with:
          version: v1.59.1
          working-directory: agent
          args: --timeout=5m

      - name: Run tests
        working-directory: agent
        run: go test -vet=off -race ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_VERSION: v0.65.0
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Giải mã mã nguồn
        uses: ./.github/actions/decrypt-source
        env:
          VKAI_CRYPT_KEY: ${{ secrets.VKAI_CRYPT_KEY }}

      # Cài trực tiếp thay vì dùng aquasecurity/trivy-action: action đó tự tải
      # binary trong bước setup và khi GitHub giới hạn tải xuống thì cả job đổ
      # ngay ở "Set up job", chặn CI vì lý do không liên quan tới mã nguồn.
      - name: Cài Trivy
        id: trivy_install
        continue-on-error: true
        run: |
          set -uo pipefail
          for i in 1 2 3; do
            if curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                 | sh -s -- -b "${RUNNER_TEMP}/bin" "${TRIVY_VERSION}"; then
              echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
              "${RUNNER_TEMP}/bin/trivy" --version
              exit 0
            fi
            echo "Lần thử $i thất bại, chờ rồi thử lại..."
            sleep $((i * 10))
          done
          echo "::warning::Không cài được Trivy sau 3 lần thử — bỏ qua bước quét."
          exit 1

      - name: Quét phụ thuộc (báo cáo SARIF)
        if: steps.trivy_install.outcome == 'success'
        continue-on-error: true
        run: |
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --format sarif \
            --output trivy-results.sarif \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --skip-dirs panel/node_modules,panel/.next,core/bin,agent/bin,dist \
            --exit-code 0

      - name: Nạp kết quả lên tab Security
        if: hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # Chỉ lỗ hổng CRITICAL đã có bản vá mới chặn Pull Request.
      # HIGH đi vào báo cáo để xử lý theo lộ trình, không chặn nhịp phát triển.
      - name: Chặn PR nếu có lỗ hổng CRITICAL
        if: github.event_name == 'pull_request' && steps.trivy_install.outcome == 'success'
        run: |
          trivy fs . \
            --scanners vuln \
            --format table \
            --ignore-unfixed \
            --severity CRITICAL \
            --skip-dirs panel/node_modules,panel/.next,core/bin,agent/bin,dist \
            --exit-code 1

      - name: Quét Snyk
        if: ${{ env.SNYK_TOKEN != '' }}
        continue-on-error: true
        uses: snyk/actions/golang@master
        with:
          args: --all-projects

  # Job "Docker Build" da bi go bo: panel khong con duoc dong goi/chay bang
  # Docker nua. Core API, Panel UI va Agent chay TRAN tren Linux (binary Go +
  # Next.js standalone + systemd). Docker van la TINH NANG cho khach hang
  # (core/internal/docker, panel/src/app/(dashboard)/docker) - phan do khong lien
  # quan toi cach dung chinh panel.

  package-scope:
    name: Package Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.decide.outputs.needed }}

    steps:
      # Dong goi phat hanh chi can thiet cho push vao main va cho tag: Pull
      # Request giu nhip nhanh. Ngoai le: PR cham vao deploy/ hoac .github/ thay
      # doi chinh cach dong goi/trien khai, nen phai duoc dong goi thu.
      # Loc theo duong dan o muc `on:` khong dung duoc vi no ap cho ca workflow;
      # gh api tra ve danh sach file cua PR ma khong can them action nao.
      - name: Quyet dinh co can dong goi khong
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ "$EVENT" != "pull_request" ]; then
            case "$REF" in
              refs/heads/main|refs/tags/v*)
                echo "Push vao ${REF} -> dong goi."
                echo "needed=true" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Push vao ${REF} -> bo qua dong goi."
                echo "needed=false" >> "$GITHUB_OUTPUT"
                ;;
            esac
            exit 0
          fi

          FILES="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
                     --jq '.[].filename')"
          if printf '%s\n' "$FILES" | grep -Eq '^(deploy/|\.github/)'; then
            echo "PR cham vao deploy/ hoac .github/ -> dong goi."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR khong cham vao deploy/ hoac .github/ -> bo qua dong goi."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [package-scope, core, panel, agent]
    if: needs.package-scope.outputs.needed == 'true'

    env:
      # Bo cuc goi phat hanh do deploy/scripts/deploy.sh quy dinh:
      #   core/bin/vkai-api, core/migrations/*.sql,
      #   panel/.next/standalone/server.js, agent/bin/vkai-agent
      # Doi bo cuc o day = deploy.sh tu choi goi ngay o buoc validate_release.
      DIST: ${{ github.workspace }}/dist
      PKG: vkai-panel-${{ github.sha }}.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Giải mã mã nguồn
        uses: ./.github/actions/decrypt-source
        env:
          VKAI_CRYPT_KEY: ${{ secrets.VKAI_CRYPT_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: panel/package-lock.json

      # `go build -o` does not create parent directories.
      - name: Prepare dist
        run: mkdir -p "$DIST/core/bin" "$DIST/agent/bin" "$DIST/panel" "$DIST/deploy"

      # CGO_ENABLED=0: a static binary that runs on servers whose glibc does not
      # match the build machine's. -trimpath drops build machine paths and the
      # -s -w in the stamp below drops the symbol table and DWARF.
      # The build stamp comes from the Makefile, the same definition a developer
      # builds with, so a binary produced here reports the same version, commit
      # and commit date as one built locally.
      - name: Resolve the build stamp
        id: stamp
        run: |
          set -euo pipefail
          echo "ldflags=$(make -s print-ldflags)" >> "$GITHUB_OUTPUT"
          make -s print-ldflags

      - name: Build Core API and CLI
        working-directory: core
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          LDFLAGS: ${{ steps.stamp.outputs.ldflags }}
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "$LDFLAGS" -o "$DIST/core/bin/vkai-api"      ./cmd/api
          go build -trimpath -ldflags "$LDFLAGS" -o "$DIST/core/bin/vkai-cli"      ./cmd/cli
          # panelctl is an administration tool the installer requires
          # (deploy/install.sh puts it in /usr/local/bin), so it belongs to the
          # release package.
          go build -trimpath -ldflags "$LDFLAGS" -o "$DIST/core/bin/vkai-panelctl" ./cmd/panelctl

      - name: Build Agent
        working-directory: agent
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          LDFLAGS: ${{ steps.stamp.outputs.ldflags }}
        run: |
          set -euo pipefail
          # The agent's main package is ./cmd, not ./cmd/agent. The agent is a
          # separate Go module, so only -s -w applies to it: it cannot import
          # core/internal/version and carries its own version constant.
          go build -trimpath -ldflags "$LDFLAGS" -o "$DIST/agent/bin/vkai-agent" ./cmd

      - name: Stage migrations
        run: cp -r core/migrations "$DIST/core/migrations"

      - name: Build Panel UI
        working-directory: panel
        env:
          # NEXT_PUBLIC_* duoc nhung vao bundle luc BUILD. Gia tri phai la URL ma
          # TRINH DUYET goi duoc; rong = cung origin qua reverse proxy cua panel.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || '' }}
        run: |
          set -euo pipefail
          npm ci
          # `npm run build` da chay postbuild:standalone, buoc nay copy
          # .next/static va public/ vao .next/standalone.
          npm run build

      # Chan tu day thay vi de may chu phat hien: thieu server.js thi
      # vkai-ui.service khong khoi dong duoc, thieu .next/standalone/.next/static
      # thi trang tra ve HTML nhung moi /_next/static/*.js deu 404.
      - name: Verify standalone build
        working-directory: panel
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js \
            || { echo "::error::Thieu panel/.next/standalone/server.js sau khi build."; exit 1; }
          test -d .next/standalone/.next/static \
            || { echo "::error::Thieu panel/.next/standalone/.next/static (postbuild:standalone khong chay?)."; exit 1; }
          echo "OK: ban build standalone day du."

      - name: Stage Panel UI
        working-directory: panel
        run: |
          set -euo pipefail
          mkdir -p "$DIST/panel/.next"
          cp -r .next/standalone "$DIST/panel/.next/standalone"
          cp package.json "$DIST/panel/package.json"

      # Unit systemd va cau hinh nginx mau di kem de may chu trien khai khong
      # phai clone lai repository.
      - name: Stage systemd units, nginx sample and deploy script
        run: |
          set -euo pipefail
          cp -r deploy/systemd "$DIST/deploy/systemd"
          mkdir -p "$DIST/deploy/nginx" "$DIST/deploy/scripts"
          cp deploy/nginx/vkai-panel.conf "$DIST/deploy/nginx/vkai-panel.conf"
          # deploy.sh di kem trong goi de may chu trien khai khong can clone repo.
          cp deploy/scripts/deploy.sh "$DIST/deploy/scripts/deploy.sh"
          chmod +x "$DIST/deploy/scripts/deploy.sh"

      - name: Create release package
        run: |
          set -euo pipefail
          tar -czf "$PKG" -C "$DIST" .
          sha256sum "$PKG" | tee "$PKG.sha256"
          ls -l "$PKG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vkai-panel-package
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ env.PKG }}
            ${{ env.PKG }}.sha256
