name: CI

# Single source of truth for continuous integration.
# backend-ci.yml and frontend-ci.yml were removed: they duplicated these jobs
# with drifting configuration (postgres 15 vs 16, codecov v3 vs v4,
# REDIS_URL vs REDIS_HOST), which made a change green in one file and red in
# the other. Every job below runs on every push/PR to main and develop.
#
# Thu muc ma nguon: core/ (Go API), panel/ (Next.js UI), agent/ (Go node agent).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Core API
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vkai
          POSTGRES_PASSWORD: vkai_password
          POSTGRES_DB: vkai_panel_test
        options: >-
          --health-cmd "pg_isready -U vkai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        # health-cmd must be quoted, otherwise `ping` is parsed as a separate
        # positional argument to `docker create` and the healthcheck never runs.
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Giải mã mã nguồn
        uses: ./.github/actions/decrypt-source
        env:
          VKAI_CRYPT_KEY: ${{ secrets.VKAI_CRYPT_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so CI can never drift from the module.
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Download dependencies
        working-directory: core
        run: go mod download

      # Blocking: the API must compile.
      - name: Build
        working-directory: core
        run: go build ./...

      # Non-blocking on purpose. golangci-lint currently reports 113 pre-existing
      # findings (105 errcheck, 2 govet, 4 ineffassign, 2 unused) that require
      # source changes. Findings still show up as annotations; flip this to
      # blocking once core/.golangci.yml runs clean.
      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        continue-on-error: true
        with:
          version: v1.59.1
          working-directory: core
          args: --timeout=5m

      - name: Run tests
        working-directory: core
        env:
          # The API reads config through viper with SetEnvPrefix("VKAI"),
          # so only VKAI_*-prefixed variables are seen. Keys are database.* /
          # redis.* / jwt.* (see internal/config/config.go).
          VKAI_DATABASE_HOST: localhost
          VKAI_DATABASE_PORT: '5432'
          VKAI_DATABASE_USER: vkai
          VKAI_DATABASE_PASSWORD: vkai_password
          VKAI_DATABASE_DBNAME: vkai_panel_test
          VKAI_DATABASE_SSLMODE: disable
          VKAI_REDIS_HOST: localhost
          VKAI_REDIS_PORT: '6379'
          VKAI_JWT_SECRET: test-secret-key
        # -vet=off: `go test` runs a vet subset by default, which would fail the
        # run on the same pre-existing findings the (non-blocking) lint step
        # already reports. Compilation is still gated by the Build step above.
        run: go test -vet=off -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: ${{ hashFiles('core/coverage.out') != '' }}
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/coverage.out
          flags: core
          fail_ci_if_error: false

  panel:
    name: Panel UI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Giải mã mã nguồn
        uses: ./.github/actions/decrypt-source
        env:
          VKAI_CRYPT_KEY: ${{ secrets.VKAI_CRYPT_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: panel/package-lock.json

      - name: Install dependencies
        working-directory: panel
        run: npm ci

      # --no-install guarantees the local next binary is used and the ESLint
      # setup wizard can never be triggered (panel/.eslintrc.json exists).
      - name: Run linter
        working-directory: panel
        run: npx --no-install next lint

      - name: Build
        working-directory: panel
        env:
          # NEXT_PUBLIC_* is inlined at BUILD time. The value must be the URL a
          # BROWSER can reach, never an internal hostname such as
          # http://vkai-core:30110. Empty = same-origin through the panel
          # reverse proxy, which is the correct default.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || '' }}
        run: npm run build

      # Runs after the build so that next-env.d.ts (git-ignored, generated by
      # `next build`) is always present on a clean checkout.
      - name: Run type check
        working-directory: panel
        run: npm run type-check

      - name: Run tests
        working-directory: panel
        run: npm test --if-present

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panel-build
          retention-days: 7
          if-no-files-found: error
          # next.config.js sets output:'standalone'; uploading all of .next would
          # also drag in .next/cache (hundreds of MB) for no benefit.
          path: |
            panel/.next/standalone
            panel/.next/static
            panel/public

  agent:
    name: Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Giải mã mã nguồn
        uses: ./.github/actions/decrypt-source
        env:
          VKAI_CRYPT_KEY: ${{ secrets.VKAI_CRYPT_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: true
          # The agent has no third-party dependencies, so there is no go.sum.
          cache-dependency-path: agent/go.mod

      # `go build ./...` cannot be used here: the only package is main at ./cmd,
      # so the implicit output name "cmd" collides with the cmd/ directory.
      - name: Build
        working-directory: agent
        run: go build -o bin/vkaid ./cmd

      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        continue-on-error: true
        with:
          version: v1.59.1
          working-directory: agent
          args: --timeout=5m

      - name: Run tests
        working-directory: agent
        run: go test -vet=off -race ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    # The `secrets` context is not available in a step-level `if:`, so the token
    # is mapped to env here and the step tests the env value instead.
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Giải mã mã nguồn
        uses: ./.github/actions/decrypt-source
        env:
          VKAI_CRYPT_KEY: ${{ secrets.VKAI_CRYPT_KEY }}

      # Reporting pass: never fails the build, results land in the Security tab.
      - name: Run Trivy (report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          skip-dirs: 'panel/node_modules,panel/.next,core/bin,agent/bin'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      # Gate: only pull requests are blocked, and only on CRITICAL findings.
      - name: Trivy gate (pull requests, CRITICAL only)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          ignore-unfixed: true
          severity: 'CRITICAL'
          exit-code: '1'
          skip-dirs: 'panel/node_modules,panel/.next,core/bin,agent/bin'

      # Skipped entirely when the secret is absent, so forks and fresh clones
      # do not show a permanently failing step.
      - name: Run Snyk security scan
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/golang@master
        continue-on-error: true
        with:
          args: --all-projects

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [core, panel, agent]
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Giải mã mã nguồn
        uses: ./.github/actions/decrypt-source
        env:
          VKAI_CRYPT_KEY: ${{ secrets.VKAI_CRYPT_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR authenticates with the built-in GITHUB_TOKEN, so no repository
      # secret is required and pull requests are never blocked on a missing one.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Core image
        uses: docker/build-push-action@v6
        with:
          context: ./core
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_PREFIX }}-core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Panel UI image
        uses: docker/build-push-action@v6
        with:
          context: ./panel
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_PREFIX }}-ui:latest
          # NEXT_PUBLIC_API_URL is inlined into the bundle at build time, so it
          # must be passed as a build arg, not as a runtime environment value.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Agent image
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_PREFIX }}-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
